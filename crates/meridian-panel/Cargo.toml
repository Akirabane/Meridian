[package]
name = "meridian-panel"
description = "A local panel to run a test bench of Meridian and Horizon servers on one machine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "meridian-panel"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
# CPU and memory of each process the panel started.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }

[dev-dependencies]
meridian-config.workspace = true

[lints]
workspace = true
