[package]
name = "meridian-proxy"
description = "The Meridian proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "meridian"
path = "src/main.rs"

[dependencies]
ctrlc = "3.4"
horizon-protocol.workspace = true
meridian-config.workspace = true
meridian-handoff.workspace = true
meridian-net.workspace = true
meridian-sidecar.workspace = true
# The notices of a backend's management protocol, read by restart.
serde_json = "1"
# The listener's queue length, which std sets to 128; see serve::listen.
socket2 = "0.6"

# SIGTERM and SIGHUP on Unix, through a safe interface (the workspace forbids unsafe code);
# see signals.rs.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
meridian-testkit.workspace = true

[lints]
workspace = true
