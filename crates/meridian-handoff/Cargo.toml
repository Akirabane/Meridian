[package]
name = "meridian-handoff"
description = "The switch of a player from one backend to another: prepare, freeze, hand over, commit."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
horizon-protocol.workspace = true
horizon-world.workspace = true
meridian-ghost.workspace = true
meridian-net.workspace = true
meridian-rewrite.workspace = true
meridian-sidecar.workspace = true
serde_json = "1"
# The digest of a server's configuration phase.
sha2 = "0.10"
# The compression level towards the players (`compress.rs`): the version and the backend horizon-protocol already
# pulls, so that the default level gives its bytes.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[dev-dependencies]
meridian-testkit.workspace = true

[lints]
workspace = true
