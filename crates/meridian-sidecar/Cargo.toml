[package]
name = "meridian-sidecar"
description = "A small process next to each backend: it relays the proxy's player requests to the backend's local control endpoint."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "meridian-sidecar"
path = "src/main.rs"

[dependencies]
# The management protocol is served over TLS by default (rustls and ring are in the
# workspace already, through meridian-net).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The challenge each connection starts with.
getrandom = "0.3"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"
# HMAC-SHA256 over every request and every reply.
sha2 = "0.10"

[lints]
workspace = true
