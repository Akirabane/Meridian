# An example configuration for the Meridian proxy. Copy it to meridian.toml and
# change what you need. Every setting except the backends and the forwarding
# secret can be left out. For the single settings below, the value shown is the
# default; the lists and tables at the end are examples, and are empty by default.

# The address players connect to.
listen = "0.0.0.0:25565"

# The line shown in the server list.
motd = "A Meridian proxy"

# The picture the server list shows beside the proxy: a PNG file of 64 by 64
# pixels, at most 16 KiB. A relative path is taken from the folder of this file. It
# is read at the start and at each reload; a file that does not fit stops the start
# (or refuses the reload). There is none unless this line is written.
# favicon = "favicon.png"

# The most players the proxy takes at once, also shown in the server list.
# 0 means no limit.
max-players = 20

# How many player names the server list shows when the pointer rests on the
# player count, at most 100.
status-sample = 12

# What happens when a player who is already connected logs in again (the same
# account, or for an unverified player the same name whatever its case):
# "refuse" the new login, or "replace" the session already open with it.
on-duplicate = "refuse"

# Connections one address may open in a minute, server list pings included.
# Further connections are closed at once, before any of their packets are read.
# 0 means no limit.
connections-per-minute = 20

# Connections that may be logging in at once, from the moment they are accepted
# to the end of their login (at most 30 s each). Further ones are closed at once,
# before any of their packets are read. 0 means no limit.
max-pending-logins = 2048
# The same for one address. 0, the default, means no limit: many players may
# share one address (a school, a LAN behind one router).
max-pending-logins-per-address = 0

# Players another server sends here with a vanilla transfer (`/transfer`): taken, they log
# in as any player, placed by the host they were sent to. Off by default, as vanilla.
# accept-transfers = false

# How players log in. Backends never check accounts themselves: they trust the
# proxy.
#   "online"   checks every player's account with the session service. A client
#              that cannot answer is refused.
#   "offline"  checks nobody: every player is unverified. Only for a closed
#              network, such as a LAN or private tests.
#   "hybrid"   checks the names that belong to an account and lets other names in
#              unverified. It needs a [[route]] for each kind of player.
# The older setting online-mode = true or false is still read, but write only one
# of the two.
auth-mode = "online"

# Packets of at least this many bytes are compressed. A negative value turns
# compression off.
compression-threshold = 256

# The zlib level of the packets compressed towards the players, from 1 (the
# fastest, the largest packets) to 9 (the slowest, the smallest). 6 is the level
# vanilla uses. A lower level uses less processor time for more bandwidth
# (docs/OPERATING.md, 5.14).
compression-level = 6

# Milliseconds allowed to reach a backend.
connect-timeout-ms = 5000

# Seconds a backend that just failed to take a player is passed over: the next
# players go straight to the next backend of their list, and it is tried last
# until the time is over. 0 never passes a backend over.
backend-retry-seconds = 10

# Milliseconds allowed for a backend's sidecar to answer (see sidecar below).
sidecar-timeout-ms = 5000

# Whether a switch to another server carries the player's position and look,
# where their client stands at that moment. With false they arrive where that
# server last had them, or at its spawn.
switch-carry-position = false

# What the other players see when a player is moved from one server to another.
# With true, the players of the new server see the join line and the list entry,
# and the players of the old server see "left the game", as Velocity and BungeeCord
# do, where changing server is a departure and an arrival for the others. With false
# the arrival (or the departure) is quiet. Both are true by default.
# switch-announce-arrival = true
# switch-announce-departure = true

# Milliseconds a player may stay frozen on the old server during a switch before
# the switch is given up. It must be below every server's max_freeze_seconds in
# its [transfer] table (30 s in Horizon by default).
switch-freeze-limit-ms = 8000

# Milliseconds kept against the freeze the old server says is left: the player is
# placed on the new server only while the freeze left outlasts this and the time
# the last requests took (twice the slowest).
switch-commit-margin-ms = 2000

# The secret shared with the backends. They use it to check that a login really
# comes from the proxy (Velocity modern forwarding), so it must be set, and set to
# the same value on every backend. The value below is a placeholder: replace it
# with a long random string and keep it out of version control.
forwarding-secret = "replace-me-with-a-long-random-secret"

# How a player's backend is chosen when they log in, once the proxy has room for
# them (otherwise they are told "The server is full"):
#
#   1. the backend of the forced host they typed, if there is one;
#   2. otherwise, when routes are set, the backends of the group the route for
#      their kind of player leads to, in the group's order;
#   3. otherwise the default backend;
#   4. then the backends of `try`, in order.
#
# A backend in a group for the other kind of player is never tried. The proxy
# tries each backend in turn, waiting up to connect-timeout-ms for each, and sends
# the player to the first that answers. If none answers, the player is told which
# servers could not be reached.

# The backend players are sent to when they log in. When it is left out, the
# first backend below is used.
default-backend = "lobby"

# Backends tried in this order when the default backend cannot be reached. Do not
# list the default backend here: it is always tried first.
try = ["east"]

# The servers behind the proxy. Each one has a unique name and an address as
# host:port. An IPv6 host goes in brackets, as "[::1]:25567". Backends should
# only be reachable from the proxy.
[[backends]]
name = "lobby"
address = "127.0.0.1:25566"
# The backend's sidecar, which moves players in and out of it (crates/meridian-
# sidecar). A backend without one cannot be switched to or from. The secret the
# proxy shares with that sidecar is in a file of its own, never here: its path is
# relative to this file, it holds at least 16 bytes, and each backend has its own.
# sidecar = "127.0.0.1:25580"
# sidecar-secret-file = "secrets/lobby.key"
# Whether the proxy asks the sidecar what the server announces of its own stop (its
# management protocol's server/stopping), so that it stops being offered before it goes
# (docs/RESTART.md). Off by default; the sidecar needs --management-properties too, and
# the backend has a role, with [balancing] enabled.
# sidecar-notices = false
# The role of the backend for load balancing: "lobby", "sublobby" (a waiting room
# where players are grouped) or "game". Without a role the backend is not balanced.
# Only "lobby" is used so far, by [balancing] below: see docs/LOAD-BALANCING.md.
# role = "lobby"
# The players the backend is filled to before the next backend of its role is
# opened. Required with a role.
# soft-cap = 40
# The most players the balancer ever places on it, taken only as overflow when every
# backend of the role is at its soft cap. At least soft-cap; defaults to soft-cap.
# hard-cap = 40

[[backends]]
name = "east"
address = "127.0.0.1:25567"

# A host name that sends players straight to one backend. The host is the name
# players type in their server list, without a port; case does not matter.
# A forced host may also have its own motd, shown in the server list to the players
# who typed this host; without one, the motd above is shown.
[[forced-host]]
host = "east.example.com"
backend = "east"
motd = "The east server"

# Groups of backends, each for one kind of player: "verified" (the session
# service confirmed the account) or "unverified" (a name the proxy let in without
# that check). A backend may not be in groups of both kinds: the two kinds get
# different unique ids for the same name, so the server would keep two files.
[[group]]
name = "accounts"
auth = "verified"
backends = ["lobby", "east"]

# Where each kind of player goes. With auth-mode = "online" only verified players
# exist, so one route is enough. With "hybrid", add a group of unverified backends
# and a route for them, for example:
#
#   [[group]]
#   name = "guests"
#   auth = "unverified"
#   backends = ["guest-lobby"]
#
#   [[route]]
#   auth = "unverified"
#   group = "guests"
[[route]]
auth = "verified"
group = "accounts"

# How the hybrid mode looks names up. Only auth-mode = "hybrid" reads this table.
[auth]
# Seconds a name found to be an account's is remembered.
lookup-cache-seconds = 3600
# Seconds a name found to be no account's is remembered. A free name can become
# an account's at any time, so this may not be longer than lookup-cache-seconds.
negative-cache-seconds = 300
# What happens when the account service does not answer: "refuse" the login
# (recommended, since the name might be an account's) or let the player in as
# "unverified".
on-lookup-failure = "refuse"
# Lookups one address may cause in a minute; names already remembered do not
# count. An address over the limit is refused until the minute is over.
lookups-per-minute = 10

# Load balancing across the backends that have a role (see the backends above).
# See docs/LOAD-BALANCING.
[balancing]
# Whether logins are placed by the balancer among the backends of role "lobby".
# Off by default: the proxy then chooses a backend as it always did. It needs at
# least one backend with a role.
enabled = false
# How far below its soft cap a backend that reached it must fall before it is
# filled again, so it does not flip between open and closed with each player who
# leaves. 0 turns this off.
margin = 2
# Seconds after which what a backend last reported (through its sidecar) is no longer
# believed; it is then not offered to new players. A backend that never reported is
# treated as accepting.
state-max-age-seconds = 15
# How a tie between equally full backends is broken: "ping" (the one the proxy
# measured as quickest to connect to) or "order" (the one listed first).
tie-break = "ping"
# Seconds between two readings of the state of each backend that has a role and a
# sidecar, and between two measures of the time a connection to it takes.
probe-interval-seconds = 10

# What the proxy does when a backend with a role is about to restart: it is marked
# draining, and offered again when it is back. See docs/RESTART.md.
[restart]
# Whether the players of a backend that is going down are sent to other backends of its
# role, one at a time, as "drain <backend> --move" sends them. Off by default: the
# players then stay on the backend.
evacuate = false
# How many readings in a row its sidecar may leave unanswered before the backend counts
# as going down. Needs [balancing] enabled and a sidecar.
silent-rounds = 3
# Seconds a backend that was told to stop may go on answering before it counts as back.
grace-seconds = 60

# What the proxy does with a player whose server is lost while they are in the game: the
# connection closes or breaks, or the server disconnects them. They are moved to another
# server, with a loading screen, instead of being disconnected. See docs/OPERATING.md.
[fallback]
# Move a player whom their server disconnects, and show them the reason in the chat.
on-kick = true
# Move a player whose server's connection closes or breaks.
on-crash = true
# The most servers tried for a player in a row, until one keeps them for a minute. Past it
# the player is disconnected with a message.
max-attempts = 3

# The PROXY protocol, version 1 or 2: the header a layer 4 load balancer (HAProxy, nginx
# stream, a host's balancer) in front of the proxy writes to say who the player is. Off by
# default. Anyone who may send the header can claim any address, so it is read only from
# the addresses listed in "trusted", and a mode other than "off" needs that list. See
# docs/OPERATING.md.
[proxy-protocol]
# "off": no header is read. "optional": a connection from a trusted address may begin with
# a header or not. "required": it must, and a connection from any other address is closed.
mode = "off"
# The addresses or ranges of the load balancers. Not a range of every address.
# trusted = ["10.0.0.5", "192.168.0.0/16"]
# Milliseconds a trusted connection has to send the whole header.
header-timeout-ms = 3000

# A page of counters in the Prometheus text format (GET /metrics) and a health check
# (GET /healthz: 200 while the proxy takes players, 503 once it is stopping). Off by
# default. It has no password and no TLS: keep it on the loopback, or behind a firewall
# that only lets your monitor in. Read when the proxy starts; a reload does not change it.
[metrics]
enabled = false
bind = "127.0.0.1:9100"

# The bans and the whitelist have a file of their own, which the console changes (ban,
# pardon, whitelist) and which is read at the start and at `reload`. It is not here, so
# that this file is never rewritten. Nothing is banned and the whitelist is off until it
# says so. A relative path is taken from this file's folder.
[access]
# file = "access.toml"

# Keep the bans and the whitelist in step with the servers' own, through the sidecars (which
# need --management-properties). Both are off. from-servers: what is banned, pardoned or
# allowed on a server reaches the proxy's lists, so a player banned on one server cannot join
# another through the proxy. to-servers: the console's ban, pardon and whitelist add/remove
# are sent to every backend that has a sidecar, tried again when one cannot be reached.
# See docs/OPERATING.md, section 5.12.
# [access.sync]
# from-servers = false
# to-servers = false

# The groups of permissions and the players in them have a file of their own too, which
# the console changes (perm) and which is read at the start, at `reload` and on SIGHUP.
# Without it /server, /hub, /lobby and /play are open to everyone, as before, and the
# staff commands need a permission nobody has. A relative path is taken from this file's
# folder.
[permissions]
# file = "permissions.toml"

# A line for the players who find no place: the proxy is full (max-players) or every
# lobby is at its hard cap. Off: they are refused with "The server is full". On: they
# wait, first come first served, until a place is free, then are refused the same way.
# The wait is limited to 20 s, and wait-seconds plus connect-timeout-ms to 27 s, because
# the player's client gives up after 30 s without a packet and the proxy sends none
# while it waits. Bans, the whitelist and the connection limit come before the line.
[queue]
enabled = false
wait-seconds = 15
max-length = 50

# The operators of the servers, read from them (docs/OPERATING.md, section 5.9). The proxy keeps
# no list of its own: a player who is an operator of the server they are on, at min-level or
# above (0 to 4), is a member of `group` of permissions.toml for the commands the proxy
# answers (/send, /glist, /alert), so give that group the nodes you want. Off: nobody is.
# Each backend whose operators count needs a [[sidecars]] entry, started with
# --management-properties. `from` lists the backends that count (empty: all that have a
# sidecar). A server that cannot be read has no operators; a list read from a server is
# forgotten after stale-after-seconds without being read or heard answering.
[operators]
from-servers = false
group = "operator"
min-level = 4
from = []
stale-after-seconds = 600

# Commands players type in game that the proxy answers itself; it never passes
# them to the backend. Any other command goes to the backend as usual.
[commands]
# "server": /server lists the servers and /server <name> asks to move to one.
# "hub": /hub and /lobby ask to move to the hub backend.
# "play": /play asks to move to the game server the balancer finds (role "game",
# [balancing] enabled). Off unless listed here, so a backend's own /play keeps working.
# "send", "glist", "alert": the staff commands /send <player|all|server:name> <server>,
# /glist [server] and /alert [server:name] <message>. Off unless listed here, and a player
# may use one only with the permission of the same name (see [permissions]).
enabled = ["server", "hub"]
# The backend /hub and /lobby lead to. When it is left out, the default backend, or,
# with [balancing] enabled and a backend of role "lobby", the lobby the balancer finds.
# hub-backend = "lobby"
# Whether players may list the servers with /server.
server-list = true

# External programs the proxy connects to and asks for decisions (docs/EXTENSIONS.md,
# docs/CONFIG.md). None by default, and then nothing changes. One [[extension]] for each
# program, which listens on the loopback and shares a token with the proxy: the file holds
# at least 32 bytes and is never logged. Only the admission at login (decide.login) is asked yet.
#
# [[extension]]
# name = "perms"                        # in logs and metrics: letters, digits, - and _
# enabled = true                        # false: read and checked, not connected to
# address = "127.0.0.1:25590"           # 127.x.y.z, [::1] or localhost; nothing else
# token-file = "extensions/perms.token" # relative to this file; at least 32 bytes
# grant = ["decide.login"]              # what it may have, from docs/EXTENSIONS.md 2.3;
#                                       # a decision point goes to one extension at most
# max-in-flight = 64                    # requests that may wait for its answers at once
# breaker-failures = 5                  # failed decisions in a row that open the breaker
# breaker-seconds = 30                  # and for how long
#
# # Only for a capability that is granted. on-error: what happens with no usable answer,
# # "default" (as if there were no extension), "allow" or "deny". The timeouts of
# # decide-login and decide-server count with [queue] wait-seconds and connect-timeout-ms
# # against the 27 s a player may stay silent.
# [extension.decide-login]
# timeout-ms = 1000
# on-error = "default"
#
# [extension.decide-command]            # needs "decide.command" in grant
# timeout-ms = 250
# on-error = "default"
# cache-seconds-max = 300
#
# [extension.decide-server]             # needs "decide.server" in grant
# timeout-ms = 1000
# on-error = "default"                  # "default" or "refuse"
