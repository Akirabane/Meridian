[workspace]
resolver = "2"
members = [
    "crates/meridian-bench",
    "crates/meridian-config",
    "crates/meridian-ghost",
    "crates/meridian-net",
    "crates/meridian-testkit",
    "crates/meridian-proxy",
    "crates/meridian-rewrite",
    "crates/meridian-sidecar",
    "crates/meridian-hmac",
    "crates/meridian-websocket",
    "crates/meridian-panel",
    "crates/meridian-handoff",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Akirabane/Meridian"

[workspace.dependencies]
# The Minecraft protocol of Horizon, pinned to one commit. Moving the pin is a
# deliberate change, made together with the version of Horizon the proxy runs against.
# `horizon-world` is a crate of the same repository that `horizon-protocol` already builds
# (it holds the NBT tags of the text components): its `rev` is the same, and the two lines
# are changed together by scripts/bump-horizon.sh.
horizon-protocol = { git = "https://github.com/horizon-rust/horizon", rev = "0d21d5520ec26c49b774bf1533e53ea8af81278d" }
horizon-world = { git = "https://github.com/horizon-rust/horizon", rev = "0d21d5520ec26c49b774bf1533e53ea8af81278d" }

meridian-config = { path = "crates/meridian-config" }
meridian-ghost = { path = "crates/meridian-ghost" }
meridian-handoff = { path = "crates/meridian-handoff" }
meridian-net = { path = "crates/meridian-net" }
meridian-rewrite = { path = "crates/meridian-rewrite" }
meridian-sidecar = { path = "crates/meridian-sidecar" }
meridian-hmac = { path = "crates/meridian-hmac" }
meridian-websocket = { path = "crates/meridian-websocket" }
meridian-testkit = { path = "crates/meridian-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
